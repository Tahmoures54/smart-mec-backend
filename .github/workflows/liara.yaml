name: CD-Liara

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Liara
        env:
          LIARA_API_TOKEN: ${{ secrets.LIARA_API_TOKEN }}
        run: |
          TOKEN="$(printf '%s' "$LIARA_API_TOKEN" | tr -d '\r\n[:space:]')"
          if [ -z "$TOKEN" ]; then
            echo "::error::Secret LIARA_API_TOKEN is empty."
            exit 1
          fi
          echo "LIARA_API_TOKEN is set (${#TOKEN} characters)."
          npm i -g @liara/cli@9
          liara deploy \
            --app="smart-mec" \
            --platform=docker \
            --build-location="germany" \
            --api-token="$TOKEN" \
            --no-app-logs
