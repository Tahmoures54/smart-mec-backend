name: CD-Liara

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Generate package-lock.json
        run: npm install --package-lock-only

      # ★ مرحله جدید: build پروژه
      - name: Build Next.js
        run: |
          npm ci
          npm run build

      # ★ مرحله جدید: کپی فایل‌های استاتیک به پوشه standalone
      - name: Copy static assets to standalone
        run: |
          cp -r public .next/standalone/
          cp -r .next/static .next/standalone/.next/

      - name: Deploy to Liara
        env:
          LIARA_API_TOKEN: ${{ secrets.LIARA_API_TOKEN }}
        run: |
          TOKEN="$(printf '%s' "$LIARA_API_TOKEN" | tr -d '\r\n[:space:]')"
          if [ -z "$TOKEN" ]; then
            echo "::error::Secret LIARA_API_TOKEN is empty."
            exit 1
          fi
          echo "LIARA_API_TOKEN is set (${#TOKEN} characters)."
          npm i -g @liara/cli@9
          liara deploy \
            --app="smart-mec" \
            --platform=docker \
            --api-token="$TOKEN" \
            --no-app-logs
